# Rule-based compliance screen applied to every record (title + description + tags).
# Patterns cover en, pt, es, de, fr. A record whose market language is NOT in supported_languages is rejected
# (fail closed) because the screen cannot vet it. Add patterns for a language BEFORE adding it to supported_languages.
# kind: "any" = any pattern matches. kind: "all_of" = every group must match somewhere in the text.
# effect: hard_reject drops the record from evidence; soft only flags it.
